# (copy from github)
name: Unity WebGL Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - '.gitignore'
      - '.github/workflows/webgl-deploy.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.21f1 LTS
          targetPlatform: WebGL
          customParameters: -executeMethod PuzzleRivalsWebGLDeployBuild.Build -quit -batchmode -nographics
          buildName: PuzzleRivals
          outputPath: build
          stagingPath: WebGL-Deploy-Staging
          compressionMethod: None

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build

      - name: Setup Pages
        id: deploy
        uses: actions/configure-pages@v4

      - name: Upload to artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4