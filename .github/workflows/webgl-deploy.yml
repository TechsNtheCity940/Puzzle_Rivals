# Unity WebGL Build and Deploy to puzzlerivals-website

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - '.gitignore'
      - '.github/workflows/webgl-deploy.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 6000.4.7f1
          buildMethod: PuzzleRivalsWebGLDeployBuild.Build
          buildName: PuzzleRivals
          buildsPath: WebGL-Deploy-Staging
          cacheKey: ${{ runner.os }}-${{ github.sha }}-${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: WebGL-Deploy-Staging

  deploy-to-puzzlerivals-website:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: WebGL-Deploy-Staging

      # Use DEPLOY_SSH_KEY secret for authentication
      - name: Setup SSH authentication
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Checkout puzzlerivals-website repo
        uses: actions/checkout@v4
        with:
          repository: TechsNtheCity940/puzzlerivals-website
          path: website

      - name: Preserve important files
        run: |
          # Preserve CNAME (domain configuration)
          cp website/CNAME website/CNAME.bak 2>/dev/null || true
          
          # Preserve favicon.ico
          cp website/favicon.ico website/favicon.ico.bak 2>/dev/null || true
          
          # Preserve README.md
          cp website/README.md website/README.md.bak 2>/dev/null || true

      - name: Deploy WebGL build to game directory
        run: |
          # Remove existing game build directory
          rm -rf website/game/
          
          # Copy Unity WebGL build to game directory
          mkdir -p website/game/
          cp -r WebGL-Deploy-Staging/* website/game/

      - name: Update root index.html to redirect to game
        run: |
          cat > website/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Puzzle Rivals</title>
            <meta http-equiv="refresh" content="0; url=./game/">
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #fff;
                text-align: center;
              }
              .container {
                padding: 2rem;
              }
              h1 {
                font-size: 2.5rem;
                margin-bottom: 1rem;
                color: #e94560;
              }
              p {
                font-size: 1.2rem;
                opacity: 0.8;
              }
              .loading {
                margin-top: 2rem;
                animation: pulse 1.5s ease-in-out infinite;
              }
              @keyframes pulse {
                0%, 100% { opacity: 0.5; }
                50% { opacity: 1; }
              }
              a {
                color: #e94560;
                text-decoration: none;
              }
              a:hover {
                text-decoration: underline;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Launching Puzzle Rivals...</h1>
              <p>Redirecting to the game...</p>
              <div class="loading">Loading...</div>
              <noscript>
                <p><a href="./game/">Click here if not redirected</a></p>
              </noscript>
            </div>
          </body>
          </html>
          EOF

      - name: Update build version file
        run: |
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > website/game/BUILD_VERSION.txt
          echo "Deployed from Puzzle_Rivals commit ${{ github.sha }}" >> website/game/BUILD_VERSION.txt

      - name: Commit and push to puzzlerivals-website
        run: |
          cd website
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet || git commit -m "Deploy WebGL build from Puzzle_Rivals (auto)"
          git push origin main