# (copy from github)
name: Unity WebGL Build and Deploy to puzzlerivals-website

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - '.gitignore'
      - '.github/workflows/webgl-deploy.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.21f1 LTS
          targetPlatform: WebGL
          customParameters: -executeMethod PuzzleRivalsWebGLDeployBuild.Build -quit -batchmode -nographics
          buildName: PuzzleRivals
          outputPath: build
          stagingPath: WebGL-Deploy-Staging
          compressionMethod: None

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build

  deploy-to-puzzlerivals-website:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build

      - name: Checkout puzzlerivals-website repo
        uses: actions/checkout@v4
        with:
          repository: TechsNtheCity940/puzzlerivals-website
          token: ${{ secrets.DEPLOY_TOKEN }}
          persist-credentials: false
          path: website

      - name: Preserve important files
        run: |
          # Preserve CNAME (domain configuration)
          cp website/CNAME website/CNAME.bak 2>/dev/null || true
          
          # Preserve style.css (used by game)
          cp website/style.css website/style.css.bak 2>/dev/null || true
          
          # Preserve favicon.ico
          cp website/favicon.ico website/favicon.ico.bak 2>/dev/null || true
          
          # Preserve README.md
          cp website/README.md website/README.md.bak 2>/dev/null || true

      - name: Deploy WebGL build to root (replacing landing page)
        run: |
          # Remove landing page and game directory
          rm -f website/index.html
          rm -rf website/game/
          
          # Copy Unity WebGL build to root
          cp -r build/* website/

      - name: Restore preserved files
        run: |
          if [ -f website/CNAME.bak ]; then
            cp website/CNAME.bak website/CNAME
            rm website/CNAME.bak
          fi
          if [ -f website/style.css.bak ]; then
            cp website/style.css.bak website/style.css
            rm website/style.css.bak
          fi
          if [ -f website/favicon.ico.bak ]; then
            cp website/favicon.ico.bak website/favicon.ico
            rm website/favicon.ico.bak
          fi
          if [ -f website/README.md.bak ]; then
            cp website/README.md.bak website/README.md
            rm website/README.md.bak
          fi

      - name: Update build version file
        run: |
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > website/BUILD_VERSION.txt
          echo "Deployed from Puzzle_Rivals commit ${{ github.sha }}" >> website/BUILD_VERSION.txt

      - name: Commit and push to puzzlerivals-website
        run: |
          cd website
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet || git commit -m "Deploy WebGL build from Puzzle_Rivals (auto)"
          git push origin main