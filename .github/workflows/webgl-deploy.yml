# (copy from github)
name: Unity WebGL Build and Deploy to puzzlerivals-website

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - '.gitignore'
      - '.github/workflows/webgl-deploy.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.21f1 LTS
          targetPlatform: WebGL
          customParameters: -executeMethod PuzzleRivalsWebGLDeployBuild.Build -quit -batchmode -nographics
          buildName: PuzzleRivals
          outputPath: build
          stagingPath: WebGL-Deploy-Staging
          compressionMethod: None

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build

  deploy-to-puzzlerivals-website:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build

      - name: Checkout puzzlerivals-website repo
        uses: actions/checkout@v4
        with:
          repository: TechsNtheCity940/puzzlerivals-website
          token: ${{ secrets.DEPLOY_TOKEN }}
          persist-credentials: false
          path: website

      - name: Deploy WebGL build to game directory
        run: |
          # Preserve CNAME and README.md
          cp website/CNAME website/CNAME.bak 2>/dev/null || true
          
          # Remove only the game build directory, not the root files
          rm -rf website/game/
          
          # Copy new build to game directory
          mkdir -p website/game/
          cp -r build/* website/game/
          
          # Restore CNAME if it existed
          if [ -f website/CNAME.bak ]; then
            cp website/CNAME.bak website/CNAME
            rm website/CNAME.bak
          fi

      - name: Update build version file
        run: |
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > website/game/BUILD_VERSION.txt
          echo "Deployed from Puzzle_Rivals commit ${{ github.sha }}" >> website/game/BUILD_VERSION.txt

      - name: Commit and push to puzzlerivals-website
        run: |
          cd website
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet || git commit -m "Deploy WebGL build from Puzzle_Rivals (auto)"
          git push origin main